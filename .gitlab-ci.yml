# GitLab CE + the shared gitlab-runner (docker executor, privileged dind).
#
# The build shape mirrors the pattern already proven on this instance by
# pank85/GroceryMoneySaver-Web, because the default shape does not work here:
#
#   * The instance advertises the registry as plain HTTP on <host>:5050, and a dind
#     daemon starts with no insecure registries, so `docker login $CI_REGISTRY` fails
#     with "http: server gave HTTP response to HTTPS client". The registry is also
#     reachable over HTTPS on the bare host, so CI_REGISTRY is overridden to that.
#   * A service `command:` alone is not enough on this runner: dind also needs an
#     explicit `entrypoint: ["dockerd"]`, otherwise the arguments are not applied.
#   * DOCKER_HOST + DOCKER_TLS_CERTDIR="" skip the certificate dance.
#
# The deploy stage mirrors pank85/bettips-ai: SSH to the homeserver, pull the freshly
# pushed :latest, then restart the systemd unit that owns the compose project. Two
# details matter: the build must have moved :latest (the pull fetches exactly that), and
# the unit restart is what recreates the container — `docker compose pull` alone changes
# nothing. Requires the protected CI variable `SSH_PRIVATE_KEY`.
#
# The image path is derived from CI_PROJECT_PATH, so the only instance-shaped values are
# the registry host and the homeserver address. On an instance with an HTTPS registry,
# drop the CI_REGISTRY override and the dind entrypoint/command and this file works
# unchanged.

stages:
  - build
  - deploy

variables:
  CI_REGISTRY: "dockerhub.pkatopodis.me"
  DOCKER_TLS_CERTDIR: ""

build-image:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      entrypoint: ["dockerd"]
      command: ["--host=tcp://0.0.0.0:2375", "--insecure-registry=gitlab-ce:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - until docker info; do sleep 1; done
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - IMAGE="$CI_REGISTRY/$CI_PROJECT_PATH"
    - docker build --pull -t "$IMAGE:$CI_COMMIT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

deploy:
  stage: deploy
  image: alpine:latest
  needs: ["build-image"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    # The trailing newline is mandatory: OpenSSH rejects a PEM key that does not end in
    # one with "Load key ... error in libcrypto: unsupported".
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 172.16.0.50 >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "Deploying $CI_COMMIT_SHA to the homeserver"
    - |
      ssh -o StrictHostKeyChecking=no pank@172.16.0.50 "
        cd ~/homeserver/docker-compose/homedashboard &&
        sudo docker compose pull &&
        sudo systemctl restart docker-compose@homedashboard
      "
    - echo "Deployment complete"
