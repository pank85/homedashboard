# GitLab CE + gitlab-runner (docker executor, privileged dind). No paid features.
#
# Self-hosted instances frequently serve the container registry over plain HTTP
# (registry_external_url without TLS), and a dind service has no insecure registries
# by default, so `docker login` fails with "http: server gave HTTP response to HTTPS
# client". The flag below takes its value from GitLab's own $CI_REGISTRY, so no
# registry host is hardcoded here: on an instance with an HTTPS registry it is
# harmless, and it always matches whatever registry the instance advertises.
#
# Shell executor alternative: comment out image and services and run the same script
# on a runner that already has a docker CLI. Registry inputs stay the CI variables.

stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  # A dind service starts with no insecure registries, and GitLab CI does not expand
  # variables inside a service `command`, so this value has to be literal. Change it
  # if your instance advertises a different registry, or delete the `command:` line
  # when your registry is served over HTTPS.
  REGISTRY_INSECURE_HOST: "dockerhub.pkatopodis.me:5050"

build-image:
  stage: build
  image: docker:27.0.3
  services:
    - name: docker:27.0.3-dind
      alias: docker
      command: ["--insecure-registry=dockerhub.pkatopodis.me:5050"]
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
